# yaml-language-server: $schema=https://aka.ms/azure-dev/v1.0/azure.yaml.json
name: trail-store
infra:
  provider: bicep
  path: infra
services:
  web:
    project: .
    language: java
    host: containerapp
    resourceName: ${SERVICE_WEB_RESOURCE_NAME}
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
