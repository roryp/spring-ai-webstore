# yaml-language-server: $schema=https://aka.ms/azure-dev/v1.0/azure.yaml.json
name: trail-store
infra:
  provider: bicep
  path: infra
services:
  web:
    project: .
    language: java
    host: containerapp
    resourceName: ca-${AZURE_ENV_NAME}
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
      buildArgs:
        - BUILD_REVISION=${BUILD_REVISION}
