spring.application.name=trail-store
spring.mvc.problemdetails.enabled=true
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
store.phase=${STORE_PHASE:4}
store.revision=${BUILD_REVISION:local}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
store.assistant.enabled=false
store.assistant.access-code-hash=${WORKSHOP_ACCESS_CODE_HASH:}
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
management.tracing.export.otlp.enabled=false
management.logging.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
management.tracing.sampling.probability=1.0
management.opentelemetry.resource-attributes[service.name]=trail-store-phase-${store.phase}
management.opentelemetry.resource-attributes[service.version]=${BUILD_REVISION:local}
management.opentelemetry.resource-attributes[deployment.environment.name]=${DEPLOYMENT_ENVIRONMENT:local}
spring.ai.chat.client.observations.log-prompt=false
spring.ai.chat.client.observations.log-completion=false
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
spring.ai.tools.observations.include-content=false
