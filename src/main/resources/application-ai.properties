store.assistant.enabled=true
spring.ai.model.chat=openai
spring.ai.openai.base-url=${AZURE_OPENAI_ENDPOINT}
spring.ai.openai.microsoft-deployment-name=${AZURE_OPENAI_DEPLOYMENT:chat}
spring.ai.openai.chat.model=${AZURE_OPENAI_DEPLOYMENT:chat}
spring.ai.openai.timeout=8s
spring.ai.openai.max-retries=0
spring.ai.openai.chat.max-completion-tokens=600
spring.ai.openai.chat.reasoning-effort=low
spring.ai.openai.chat.parallel-tool-calls=false
