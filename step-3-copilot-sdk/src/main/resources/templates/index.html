<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trail Store</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
    <h1>Trail Store</h1>
    <p class="step">Step 3 · With the GitHub Copilot SDK</p>
</header>
<main>
    <section class="ask">
        <form method="post" action="/ask">
            <label for="question">Ask the store</label>
            <input id="question" name="question" maxlength="300" required
                   placeholder="Which jackets are in stock?" th:value="${question}">
            <button type="submit">Ask</button>
        </form>
        <form method="post" action="/ask" class="examples">
            <button name="question" value="Find me a waterproof jacket that's in stock. If the Summit jacket is unavailable, suggest an alternative.">Waterproof jacket in stock?</button>
            <button name="question" value="Are the Ridge Hiking Boots in stock? If not, suggest an alternative.">Boots in stock?</button>
            <button name="question" value="Run the ls command and show me the files on your server.">Run a command</button>
        </form>
        <p class="answer" th:if="${answer}" th:text="${answer}">The answer appears here.</p>
        <div class="tool-calls" th:unless="${#lists.isEmpty(toolCalls)}">
            <p>The agent's steps</p>
            <ol>
                <li th:each="call : ${toolCalls}" th:text="${call}">search_products {text=waterproof}</li>
            </ol>
        </div>
    </section>
    <div class="products">
        <article th:each="product : ${products}">
            <p class="sku" th:text="${product.sku()}">JKT-001</p>
            <h2 th:text="${product.name()}">Trail Rain Jacket</h2>
            <p class="price" th:text="|$${product.price()}|">$99</p>
            <p th:if="${product.stock() > 0}" th:text="|${product.stock()} in stock|">12 in stock</p>
            <p th:unless="${product.stock() > 0}" class="sold-out">Out of stock</p>
        </article>
    </div>
</main>
</body>
</html>
