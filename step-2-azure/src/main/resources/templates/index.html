<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trail Store</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
    <h1>Trail Store</h1>
    <p class="step">Step 2 · Running on Azure</p>
</header>
<main>
    <div class="products">
        <article th:each="product : ${products}">
            <p class="sku" th:text="${product.sku()}">JKT-001</p>
            <h2 th:text="${product.name()}">Trail Rain Jacket</h2>
            <p class="price" th:text="|$${product.price()}|">$99</p>
            <p th:if="${product.stock() > 0}" th:text="|${product.stock()} in stock|">12 in stock</p>
            <p th:unless="${product.stock() > 0}" class="sold-out">Out of stock</p>
        </article>
    </div>
</main>
</body>
</html>
