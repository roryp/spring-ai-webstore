spring.application.name=trail-store

# The AI model in Microsoft Foundry. On Azure, AZURE_OPENAI_ENDPOINT is set for us.
# Foundry serves this model through the OpenAI API, so we use Spring AI's OpenAI support.
spring.ai.openai.base-url=${AZURE_OPENAI_ENDPOINT}
spring.ai.openai.chat.model=gpt-6-luna
# Tool calls on this model's chat API need reasoning switched off.
spring.ai.openai.chat.reasoning-effort=none
# Keep answers short: this caps each answer's length and cost.
spring.ai.openai.chat.max-completion-tokens=300

# OpenTelemetry. On Azure, Container Apps tells the app where to send traces.
# Record every request (the default is 10%), and send traces only.
management.tracing.sampling.probability=1.0
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
