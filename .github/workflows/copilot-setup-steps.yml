name: Copilot setup

on: workflow_dispatch

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Download dependencies for every step
        run: |
          for step in step-*/; do
            (cd "$step" && ./mvnw -B -ntp dependency:go-offline)
          done
